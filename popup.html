<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light dark;
      --accent: #4f7cff;
      --line: color-mix(in srgb, CanvasText 20%, transparent);
      --fill: color-mix(in srgb, CanvasText 6%, transparent);
    }

    * { box-sizing: border-box; }

    body {
      width: 240px;
      margin: 0;
      padding: 14px 16px 16px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: var(--accent);
    }

    output {
      min-width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      margin: 8px 0 12px;
      opacity: .65;
      font-size: 12px;
    }

    button {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--fill);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: color-mix(in srgb, CanvasText 12%, transparent);
    }

    button:active { transform: translateY(1px); }

    /* Firefox for Android opens the action popup as a full-screen overlay. */
    @media (min-width: 300px) {
      html { min-height: 100%; }

      body {
        width: auto;
        max-width: 540px;
        min-height: 100vh;
        margin: 0 auto;
        padding: 28px 22px max(28px, env(safe-area-inset-bottom));
        font-size: 16px;
        line-height: 1.45;
      }

      h1 {
        margin-bottom: 20px;
        font-size: 21px;
        letter-spacing: -.01em;
      }

      label { margin-bottom: 10px; }

      input[type="range"] { height: 34px; }

      output {
        min-width: 62px;
        font-size: 17px;
        font-weight: 600;
      }

      .hint {
        margin: 10px 0 22px;
        font-size: 14px;
      }

      button {
        min-height: 48px;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <h1>Click to View Media</h1>

  <label for="blur">Blur intensity</label>
  <div class="row">
    <input id="blur" type="range" min="18" max="100" step="1" value="18">
    <output id="blur-value" for="blur">18px</output>
  </div>
  <p class="hint">Minimum is 18px. Higher values hide more detail.</p>

  <button id="reset" type="button">Reset to 18px</button>

  <script src="popup.js"></script>
</body>
</html>
