<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { color-scheme: light dark; }
    body {
      width: 240px;
      margin: 0;
      padding: 14px 16px 16px;
      font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: Canvas;
      color: CanvasText;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 600;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: #4f7cff;
    }
    output {
      min-width: 42px;
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .hint {
      margin: 8px 0 12px;
      opacity: .65;
      font-size: 12px;
    }
    button {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
      border-radius: 7px;
      background: color-mix(in srgb, CanvasText 7%, transparent);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button:hover {
      background: color-mix(in srgb, CanvasText 12%, transparent);
    }
  </style>
</head>
<body>
  <h1>Click to View Media</h1>

  <label for="blur">Blur intensity</label>
  <div class="row">
    <input id="blur" type="range" min="18" max="100" step="1" value="18">
    <output id="blur-value" for="blur">18px</output>
  </div>
  <p class="hint">Minimum is 18px. Higher values hide more detail.</p>

  <button id="reset" type="button">Reset to 18px</button>

  <script src="popup.js"></script>
</body>
</html>
